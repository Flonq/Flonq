<rect width="1200" height="220" rx="18" fill="url(#bg)"/>
<rect x=".75" y=".75" width="1198.5" height="218.5" rx="17.25" stroke="url(#edge)" stroke-width="1.5"/>

<line x1="400" y1="32" x2="400" y2="188" stroke="#FFFFFF" stroke-opacity=".055"/>
<line x1="800" y1="32" x2="800" y2="188" stroke="#FFFFFF" stroke-opacity=".055"/>

