<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Mert Kaan Kindar — Software Engineer</title>
  <desc>Liquid Signal profile hero for FLONQ, focused on game, AI and web systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06080C"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0" cy="0" r="1" gradientTransform="translate(270 140) rotate(21) scale(260 170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DEBFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBlue" cx="0" cy="0" r="1" gradientTransform="translate(890 110) rotate(-10) scale(260 170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A8CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5A8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0" cy="0" r="1" gradientTransform="translate(960 360) rotate(8) scale(250 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F6BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="80" y1="70" x2="1110" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDFBFF" stop-opacity="0.52"/>
      <stop offset="0.3" stop-color="#7DEBFF" stop-opacity="0.2"/>
      <stop offset="0.65" stop-color="#5A8CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <animate attributeName="x1" values="-300;80;-300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900;1110;900" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="160" y1="160" x2="730" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E6EAF1"/>
      <stop offset="1" stop-color="#9AA6B8"/>
    </linearGradient>
    <linearGradient id="titleShimmer" x1="-0.35" y1="0" x2="0.05" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#E9FDFF" stop-opacity="0.92"/>
      <stop offset="0.56" stop-color="#7DEBFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.45;1.2;-0.45" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.05;1.6;-0.05" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur42" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="460" rx="34" fill="url(#bg)"/>

  <g filter="url(#blur42)">
    <ellipse cx="230" cy="130" rx="220" ry="130" fill="url(#orbCyan)">
      <animate attributeName="cx" values="230;300;250;230" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;100;170;130" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="930" cy="120" rx="230" ry="130" fill="url(#orbBlue)">
      <animate attributeName="cx" values="930;840;900;930" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;160;95;120" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="360" rx="220" ry="120" fill="url(#orbViolet)">
      <animate attributeName="cx" values="980;900;1020;980" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;330;385;360" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect x="42" y="42" width="1116" height="376" rx="28" fill="#FFFFFF" fill-opacity="0.025"/>
  <rect x="42.75" y="42.75" width="1114.5" height="374.5" rx="27.25" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="376" rx="28" filter="url(#grain)" opacity="0.24"/>

  <path d="M72 92V72H92" stroke="#F5FBFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M1128 368V388H1108" stroke="#F5FBFF" stroke-opacity="0.24" stroke-width="1.5"/>

  <text x="88" y="93" fill="#B6C2D2" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" letter-spacing="3.4">FLONQ / PROFILE</text>
  <text x="1112" y="93" text-anchor="end" fill="#7F8A99" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="1.8">SOFTWARE ENGINEERING / 2026</text>

  <text x="88" y="205" fill="url(#titleGrad)" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1.1">MERT KAAN KINDAR</text>
  <text x="88" y="205" fill="url(#titleShimmer)" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1.1">MERT KAAN KINDAR</text>
  <text x="90" y="250" fill="#C7D1DF" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18" letter-spacing="3.4">SOFTWARE ENGINEER · GAME / AI / WEB SYSTEMS</text>

  <text x="90" y="308" fill="#A7B2C1" font-family="Segoe UI, Arial, sans-serif" font-size="17">I build interactive software where engineering, simulation, AI and polished interfaces meet.</text>
  <text x="90" y="336" fill="#7F8A99" font-family="Segoe UI, Arial, sans-serif" font-size="15">Clear architecture. Purposeful interfaces. Software designed to feel complete.</text>

  <g transform="translate(90 372)">
    <circle cx="8" cy="8" r="4.5" fill="#7DEBFF" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="8" r="10" fill="none" stroke="#7DEBFF" stroke-opacity="0.35">
      <animate attributeName="r" values="7;13;7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="13" fill="#B9C6D5" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="1.8">CURRENTLY BUILDING · UAV FLIGHT SIMULATOR</text>
  </g>

  <text x="1110" y="382" text-anchor="end" fill="#798493" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" letter-spacing="1.7">ENGINEERING · INTERACTION · SYSTEMS</text>
</svg>