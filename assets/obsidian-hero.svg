<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Mert Kaan Kindar — Software Engineer</title>
<desc>Minimal editorial profile hero for Mert Kaan Kindar, working across game, AI and web systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#08090B"/>
    <stop offset="0.58" stop-color="#0A0B0E"/>
    <stop offset="1" stop-color="#0C0D10"/>
  </linearGradient>
  <radialGradient id="softLight" cx="0" cy="0" r="1" gradientTransform="translate(240 82) rotate(27) scale(410 230)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D9D4C8" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#D9D4C8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="border" x1="35" y1="28" x2="1160" y2="372" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F1EEE7" stop-opacity="0.20"/>
    <stop offset="0.5" stop-color="#B9B4AA" stop-opacity="0.09"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="nameFill" x1="72" y1="130" x2="695" y2="220" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F1EEE7"/>
    <stop offset="0.62" stop-color="#E7E3DB"/>
    <stop offset="1" stop-color="#C9C4BA"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.028"/></feComponentTransfer>
  </filter>
</defs>

<rect width="1200" height="400" rx="28" fill="url(#bg)"/>
<rect width="1200" height="400" rx="28" fill="url(#softLight)"/>
<rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="27.25" stroke="url(#border)" stroke-width="1.5"/>
<rect width="1200" height="400" rx="28" filter="url(#grain)" opacity="0.28"/>

<text x="72" y="174" fill="url(#nameFill)" font-family="Georgia, Times New Roman, serif" font-size="62" font-weight="600" letter-spacing="0.8">MERT KAAN KINDAR</text>

<text x="74" y="218" fill="#CFC7BC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="3.5">SOFTWARE ENGINEER · GAME / AI / WEB SYSTEMS</text>

<text x="74" y="273" fill="#B8BEC8" font-family="Segoe UI, Arial, sans-serif" font-size="16">I build interactive software across simulation, game systems and modern web experiences —</text>
<text x="74" y="300" fill="#969EAA" font-family="Segoe UI, Arial, sans-serif" font-size="15">with an emphasis on clear architecture and purposeful execution.</text>

<text x="74" y="350" fill="#8F96A0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">CURRENT BUILD</text>
<text x="198" y="350" fill="#E2DDD5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">UAV FLIGHT SIMULATOR</text>

<!-- Minimal orbital geometry: decorative only -->
<g opacity="0.46">
  <line x1="930" y1="112" x2="930" y2="306" stroke="#E6E1D7" stroke-opacity="0.13"/>
  <ellipse cx="930" cy="210" rx="112" ry="48" transform="rotate(-18 930 210)" stroke="#E6E1D7" stroke-opacity="0.15"/>
  <ellipse cx="930" cy="210" rx="99" ry="70" transform="rotate(30 930 210)" stroke="#E6E1D7" stroke-opacity="0.09"/>
  <path d="M827 274C887 303 983 270 1012 176" stroke="#E6E1D7" stroke-opacity="0.16"/>
  <circle cx="930" cy="141" r="2.8" fill="#ECE6DC" fill-opacity="0.72"/>
  <circle cx="930" cy="210" r="2.2" fill="#D7D1C7" fill-opacity="0.60"/>
  <circle cx="827" cy="274" r="2" fill="#C2BCB2" fill-opacity="0.48"/>
  <circle cx="1012" cy="176" r="1.8" fill="#B5AFA5" fill-opacity="0.42"/>
</g>
</svg>
