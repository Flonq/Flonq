<svg width="360" height="230" viewBox="0 0 360 230" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Scoovi — selected product work</title>
<desc>Smart shopping assistant built with React, Vite and FastAPI.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="360" y2="230"><stop stop-color="#090D13"/><stop offset="1" stop-color="#0D121A"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(62 32) rotate(39) scale(180 125)"><stop stop-color="#7DEBFF" stop-opacity=".10"/><stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="20" y1="20" x2="340" y2="210"><stop stop-color="#DDFBFF" stop-opacity=".38"/><stop offset=".55" stop-color="#7DEBFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/></linearGradient>
</defs>
<rect width="360" height="230" rx="22" fill="url(#bg)"/>
<rect width="360" height="230" rx="22" fill="url(#glow)"/>
<rect x=".75" y=".75" width="358.5" height="228.5" rx="21.25" stroke="url(#edge)" stroke-width="1.5"/>
<text x="24" y="34" fill="#7DEBFF" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="2">01 / PRODUCT SYSTEM</text>
<text x="24" y="82" fill="#F5F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing=".4">SCOOVI</text>
<text x="24" y="108" fill="#AAB5C4" font-family="Segoe UI, Arial, sans-serif" font-size="13">Smart shopping assistant for discovering</text>
<text x="24" y="127" fill="#AAB5C4" font-family="Segoe UI, Arial, sans-serif" font-size="13">alternative purchasing options.</text>
<line x1="24" y1="152" x2="336" y2="152" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="24" y="180" fill="#7F8A99" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1">REACT · VITE · FASTAPI</text>
<text x="24" y="207" fill="#D4DEE9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.3">SCOOVI.APP  ↗</text>
<circle cx="324" cy="32" r="4" fill="#7DEBFF"><animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>
