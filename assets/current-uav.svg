<text x="48" y="249" fill="#6F7B8A" font-family="Arial, Helvetica, sans-serif" font-size="11">PRIVATE · PUBLIC RELEASE AFTER THIRD-PARTY ASSET REDISTRIBUTION REVIEW</text>
