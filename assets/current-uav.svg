<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270"><stop stop-color="#080C12"/><stop offset="1" stop-color="#0C1119"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 40) rotate(150) scale(420 250)"><stop stop-color="#7DEBFF" stop-opacity=".13"/><stop offset="1" stop-color="#7DEBFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="55" y1="35" x2="1145" y2="235"><stop stop-color="#DDFBFF" stop-opacity=".38"/><stop offset=".45" stop-color="#7DEBFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/></linearGradient>
  <filter id="glowdot"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="270" rx="28" fill="url(#bg)"/>
<rect width="1200" height="270" rx="28" fill="url(#glow)"/>
<rect x=".75" y=".75" width="1198.5" height="268.5" rx="27.25" stroke="url(#edge)" stroke-width="1.5"/>
<text x="48" y="48" fill="#7DEBFF" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">ACTIVE BUILD / 01</text>
<g transform="translate(1080 33)"><circle cx="8" cy="8" r="4.5" fill="#7DEBFF" filter="url(#glowdot)"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle><text x="25" y="12" fill="#AEB9C8" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.6">ACTIVE</text></g>
<text x="48" y="103" fill="#F5F8FC" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">UAV FLIGHT SIMULATOR</text>
<text x="48" y="136" fill="#AAB5C4" font-family="Arial, Helvetica, sans-serif" font-size="15">Fixed-wing flight simulation built system-by-system in Unity 6.3 LTS and C#.</text>
<line x1="48" y1="162" x2="1152" y2="162" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="48" y="192" fill="#7F8A99" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.2">CURRENT STAGE</text>
